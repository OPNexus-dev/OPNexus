# Tests bei jedem Push auf den Hauptzweig und bei PRs. Wird auch vom Release-Workflow
# wiederverwendet (workflow_call mit source_ref = Release-Tag), damit ein Release nie
# Images baut, deren Tests nicht grün waren.
#
# Die Jobs laufen bewusst in Containern (`container:`): dann ist der
# Postgres-Service überall unter dem Namen "postgres" erreichbar — auf
# GitHub genauso wie auf einem Forgejo/Gitea-Runner im Docker-Modus.
name: CI

on:
  push:
    # Das private Entwicklungsrepo heißt master, das öffentliche main (publish_public.sh).
    branches: [main, master]
    # Änderungen nur an den Workflows lösen keinen Testlauf aus.
    paths-ignore:
      - '.github/workflows/release.yml'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        description: 'Optionaler Git-Tag/Ref für Release-Tests'
        required: false
        type: string
        default: ''

jobs:
  backend:
    runs-on: ubuntu-latest
    # Volles Image (nicht -slim): enthält git für actions/checkout.
    container: python:3.12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opnexus
          POSTGRES_PASSWORD: ci
          # conftest.py erwartet eine DB, deren Name auf _test endet.
          POSTGRES_DB: opnexus_test
        options: >-
          --health-cmd "pg_isready -U opnexus"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://opnexus:ci@postgres:5432/opnexus_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      # pg_dump/pg_restore 16 wie im Backend-Image (Dumps nur gleiche Hauptversion).
      - run: backend/scripts/install_pg_client.sh 16
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    container: node:20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      # next build prüft auch die Typen.
      - run: npm run build
        working-directory: frontend

  # Schnelle Konsistenzprüfungen, die ohne Datenbank und Build auskommen.
  checks:
    runs-on: ubuntu-latest
    container: node:20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - run: python3 scripts/check_i18n.py
      - run: for f in opnexus check_version.sh make_release_bundle.sh release_compose.sh release_common.sh build_release_images.sh copy_release_images.sh verify_release_images.sh promote_floating_tags.sh; do bash -n scripts/$f; done
      # Updater-Container (Zustandsübergänge, Ablehnungen, Auth) ohne Docker-Daemon.
      - run: python3 -m unittest discover -s updater -p 'test_*.py'
