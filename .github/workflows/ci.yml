# CI auf main/PRs und wiederverwendbare Tests für einen expliziten Release-Tag.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/release.yml'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_call:
    inputs:
      source_ref:
        description: 'Optionaler Git-Tag/Ref für Release-Tests'
        required: false
        type: string
        default: ''

jobs:
  backend:
    runs-on: ubuntu-latest
    container: python:3.12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opnexus
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: opnexus_test
        options: >-
          --health-cmd "pg_isready -U opnexus"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://opnexus:ci@postgres:5432/opnexus_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - run: backend/scripts/install_pg_client.sh 16
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    container: node:20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  checks:
    runs-on: ubuntu-latest
    container: node:20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - run: python3 scripts/check_i18n.py
      - run: bash -n scripts/opnexus && bash -n scripts/check_version.sh && bash -n scripts/make_release_bundle.sh
      - run: python3 -m unittest discover -s updater -p 'test_*.py'
