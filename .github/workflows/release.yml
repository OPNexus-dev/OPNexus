# Prüft die veröffentlichten Release-Images einer Version in beiden Registries (GHCR und Gitea): Tags, Plattformen
# (amd64, arm64), cosign-Signatur, gleiche Digests, Release-Compose im Updater-Image. Nur von Hand:
# Actions > "Release-Images prüfen" > Run workflow, Eingabe z. B. v1.36.0.
#
# Dieser Workflow baut und veröffentlicht NICHTS. Die Images entstehen genau einmal, auf dem Maintainer-Host
# (scripts/release_all.sh: scripts/build_release_images.sh, dann scripts/copy_release_images.sh), signiert mit dem Projektschlüssel
# und digestgleich in beide Registries kopiert. Ein zweiter Build hier hätte einen anderen Digest und keine Signatur,
# und `opnexus update` lehnt Images ohne gültige Signatur ab. Darum hat er keinen Schreibzugriff auf Pakete und keinen Tag-Trigger.
#
# Der Lauf braucht keine Zugangsdaten (beide Registries sind öffentlich lesbar).
name: Release-Images prüfen

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Veröffentlichter Git-Tag, z. B. v1.36.0'
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Release-Tag prüfen
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ ! "$INPUT_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Ungültiger Versions-Tag: $INPUT_VERSION" >&2
            exit 1
          fi
          echo "tag=$INPUT_VERSION" >> "$GITHUB_OUTPUT"

      # Die Prüfskripte kommen vom Hauptzweig (ältere Tags kennen sie noch nicht); die Git-Tags braucht
      # release_tags, um zu wissen, welche schwebenden Tags (X.Y, X, latest) zu erwarten sind.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: cosign installieren (feste Version, geprüfte Prüfsumme wie in updater/Dockerfile)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o cosign https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
          echo "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  cosign" | sha256sum -c -
          sudo install -m 0755 cosign /usr/local/bin/cosign

      - name: Images prüfen
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null || { echo "Der Tag $RELEASE_TAG existiert in diesem Repository nicht." >&2; exit 1; }
          scripts/verify_release_images.sh "$RELEASE_TAG"
