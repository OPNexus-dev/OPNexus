# OPNexus: automatische Tag-Releases und manueller Rebuild vorhandener Tags.
# Manuelle Ausführung auf main: version = v1.35.0.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existierender Git-Tag, z. B. v1.35.0'
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Release-Tag bestimmen
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_VERSION"
          else
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Ungültiger stabiler Versions-Tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          persist-credentials: false

      - name: Versionskonsistenz prüfen
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: scripts/check_version.sh "$RELEASE_TAG"

  test:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.verify.outputs.tag }}

  publish:
    needs: [verify, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: [backend, frontend, proxy, updater]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
          persist-credentials: false

      - name: Ziel bestimmen
        id: target
        env:
          REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
          NAMESPACE: ${{ vars.IMAGE_NAMESPACE || github.repository_owner }}
        run: |
          echo "image=$(echo "$REGISTRY/$NAMESPACE/opnexus-${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY || 'ghcr.io' }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Image-Tags bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.target.outputs.image }}
          # Manuelle Backfills nur mit exaktem Versions-Tag, keine Floating-Tags überschreiben.
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
